<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ESP Web Flasher</title>
<script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
<style>
:root{color-scheme:light;--ink:#20252b;--muted:#69727c;--line:#dfe3e7;--paper:#fff;--wash:#f3f5f6;--accent:#2f5960}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--wash)}.page{width:min(680px,calc(100% - 32px));margin:42px auto}.header{position:relative;min-height:190px;overflow:hidden;padding:28px 30px;color:#f5f7f7;background:#263e43;border-radius:16px 16px 0 0}.header:after{content:"";position:absolute;inset:0;opacity:.18;background-image:linear-gradient(135deg,transparent 48%,#b9ced0 49%,transparent 50%);background-size:34px 34px}.header-copy,.chip-art{position:relative;z-index:1}.header-copy{max-width:360px}.eyebrow{margin:0 0 12px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#b8ccce}h1{margin:0;font-size:clamp(27px,5vw,38px);line-height:1.05;letter-spacing:-.04em;font-weight:650}.header p{margin:12px 0 0;color:#d3dfe0;font-size:14px;line-height:1.5}.chip-art{position:absolute;right:34px;bottom:26px;width:142px;opacity:.9}.chip-art rect{fill:none;stroke:#c5d7d8;stroke-width:2}.chip-art .core{fill:#c5d7d8;stroke:none}.chip-art line{stroke:#c5d7d8;stroke-width:2}.panel{padding:28px 30px 30px;background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;box-shadow:0 12px 30px rgba(26,36,41,.07)}.section-label{margin:0 0 14px;font-size:13px;font-weight:650}.boards{display:grid;gap:10px}.board{display:flex;align-items:center;gap:13px;padding:14px 15px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}.board:hover{border-color:#9db1b4;background:#fafcfc}.board.selected{border-color:var(--accent);background:#f1f6f6}.board input{width:17px;height:17px;margin:0;accent-color:var(--accent)}.board-name{display:block;font-size:14px;font-weight:600}.board-detail{display:block;margin-top:3px;color:var(--muted);font-size:12px}.action{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:25px;padding-top:22px;border-top:1px solid var(--line)}.hint{margin:0;color:var(--muted);font-size:12px;line-height:1.45}esp-web-install-button{flex:0 0 auto}@media(max-width:520px){.page{width:min(100% - 20px,680px);margin:20px auto}.header,.panel{padding-left:21px;padding-right:21px}.chip-art{right:18px;width:105px;opacity:.32}.action{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="page"><header class="header"><div class="header-copy"><p class="eyebrow">ESP Web Flasher</p><h1>Install Twinkle.</h1><p>Pilih board yang digunakan, sambungkan ke USB, lalu mulai instalasi.</p></div><svg class="chip-art" viewBox="0 0 150 120" aria-hidden="true"><rect x="39" y="24" width="72" height="72" rx="8"/><rect class="core" x="58" y="43" width="34" height="34" rx="4"/><line x1="27" y1="40" x2="39" y2="40"/><line x1="27" y1="60" x2="39" y2="60"/><line x1="27" y1="80" x2="39" y2="80"/><line x1="111" y1="40" x2="123" y2="40"/><line x1="111" y1="60" x2="123" y2="60"/><line x1="111" y1="80" x2="123" y2="80"/><line x1="59" y1="12" x2="59" y2="24"/><line x1="75" y1="12" x2="75" y2="24"/><line x1="91" y1="12" x2="91" y2="24"/><line x1="59" y1="96" x2="59" y2="108"/><line x1="75" y1="96" x2="75" y2="108"/><line x1="91" y1="96" x2="91" y2="108"/></svg></header><section class="panel"><p class="section-label">Pilih board</p><div class="boards" role="radiogroup" aria-label="Pilihan board"><label class="board selected"><input type="radio" name="board" value="manifest-esp32.json" checked><span><span class="board-name">ESP32 standar</span><span class="board-detail">Flash 4MB · pilihan umum</span></span></label><label class="board"><input type="radio" name="board" value="manifest-esp32-s3-8mb.json"><span><span class="board-name">ESP32-S3</span><span class="board-detail">Flash 8MB · tanpa PSRAM</span></span></label><label class="board"><input type="radio" name="board" value="manifest-esp32-s3-n16r8.json"><span><span class="board-name">ESP32-S3 N16R8</span><span class="board-detail">Flash 16MB · PSRAM 8MB</span></span></label></div><div class="action"><p class="hint">Gunakan Chrome atau Edge, lalu izinkan akses ke perangkat USB.</p><esp-web-install-button id="install-button" manifest="manifest-esp32.json"></esp-web-install-button></div></section><p class="hint" style="text-align:center;margin-top:16px">Aplikasi Android &amp; Windows: <a href="https://github.com/karbyt/twinkle/releases">unduh di GitHub Releases</a></p></main><script>const installButton=document.getElementById("install-button");document.querySelectorAll("input[name='board']").forEach(radio=>{radio.addEventListener("change",()=>{installButton.manifest=radio.value;document.querySelectorAll(".board").forEach(board=>board.classList.remove("selected"));radio.closest(".board").classList.add("selected")})});</script></body></html>
