<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unduh jadwal sholat (.bin)</title>
<style>
:root{--bg:#f3f6f1;--panel:#fff;--ink:#14261c;--mute:#5b6e63;--line:#d3ddd5;--acc:#0f6b3f;--accInk:#fff;--err:#b3261e;--code:#e9efe9}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a13;--panel:#14261c;--ink:#e6f0e8;--mute:#93a99b;--line:#264033;--acc:#3ddc84;--accInk:#06210f;--err:#ff8a80;--code:#0d1a13}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px 16px}
main{max-width:560px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-weight:600;margin:14px 0 4px}
label:first-child{margin-top:0}
select,button{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
select:disabled{opacity:.5}
button{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:700;cursor:pointer;margin-top:18px}
button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#msg{margin-top:14px;min-height:1.5em;color:var(--mute);font-size:.95rem}
#msg.err{color:var(--err)}
#hex{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--mute);margin-top:6px;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>Unduh jadwal sholat (.bin)</h1>
<p class="sub">Pilih provinsi, kab/kota, dan tahun.</p>
<div class="panel">
  <label for="prov">Provinsi</label>
  <select id="prov" disabled><option>Memuat…</option></select>
  <label for="kabko">Kab/Kota</label>
  <select id="kabko" disabled></select>
  <label for="year">Tahun</label>
  <select id="year" disabled></select>
  <button id="go" disabled>Unduh .bin</button>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="hex"></div>
</div>
</main>
<script>
const CACHE='cache'; // folder berisi PROVINSI/KAB. NAMA/TAHUN.bin dan index.json
const $=id=>document.getElementById(id);
let idx={};

function fill(sel,items){
  sel.innerHTML='';
  for(const t of items){const o=document.createElement('option');o.value=o.textContent=t;sel.appendChild(o)}
  sel.disabled=!items.length;
}
function onProv(){fill($('kabko'),Object.keys(idx[$('prov').value]||{}));onKabko()}
function onKabko(){
  const ys=(idx[$('prov').value]||{})[$('kabko').value]||[];
  fill($('year'),ys.map(String));
  $('go').disabled=!ys.length;
}
function msg(t,err){$('msg').textContent=t;$('msg').className=err?'err':''}

async function init(){
  try{
    const r=await fetch(CACHE+'/index.json');
    if(!r.ok)throw new Error('HTTP '+r.status);
    idx=await r.json();
    fill($('prov'),Object.keys(idx));
    onProv();
  }catch(e){
    $('prov').innerHTML='<option>Gagal memuat</option>';
    msg('Gagal memuat '+CACHE+'/index.json ('+e.message+'). Buka halaman lewat http(s), bukan file://, dan pastikan index.json sudah dibuat.',true);
  }
}
$('prov').addEventListener('change',onProv);
$('kabko').addEventListener('change',onKabko);

$('go').addEventListener('click',async()=>{
  const p=$('prov').value,k=$('kabko').value,y=$('year').value;
  const url=[CACHE,p,k,y+'.bin'].map(encodeURIComponent).join('/');
  $('go').disabled=true;msg('Mengunduh…');$('hex').textContent='';
  try{
    const r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const buf=await r.arrayBuffer();
    const u=URL.createObjectURL(new Blob([buf],{type:'application/octet-stream'}));
    const a=document.createElement('a');a.href=u;a.download=y+'.bin';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),10000);
    msg(`${k}, ${p} · ${y}.bin · ${buf.byteLength} byte`);
    $('hex').textContent='Awal: '+Array.from(new Uint8Array(buf,0,Math.min(32,buf.byteLength)),b=>b.toString(16).padStart(2,'0')).join(' ');
  }catch(e){msg('Gagal mengunduh: '+e.message,true)}
  finally{$('go').disabled=false}
});
init();
</script>
</body>
</html>
